<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="qGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86B817"/>
      <stop offset="1" stop-color="#4FA63A"/>
    </linearGradient>
    <linearGradient id="textGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74B72E"/>
      <stop offset="1" stop-color="#57A837"/>
    </linearGradient>
    <mask id="qMask" maskUnits="userSpaceOnUse" x="0" y="0" width="420" height="400">
      <!-- white = visible, black = transparent cut-outs -->
      <rect x="0" y="0" width="420" height="400" fill="black"/>
      <circle cx="200" cy="190" r="145" fill="white"/>
      <circle cx="200" cy="190" r="72" fill="black"/>
      <!-- parcel/grid cut-outs -->
      <rect x="70" y="112" width="260" height="8" fill="black"/>
      <rect x="70" y="194" width="260" height="8" fill="black"/>
      <rect x="98" y="276" width="205" height="8" fill="black"/>
      <rect x="125" y="78" width="8" height="115" fill="black"/>
      <rect x="187" y="48" width="8" height="70" fill="black"/>
      <rect x="230" y="58" width="8" height="118" fill="black"/>
      <rect x="105" y="205" width="8" height="100" fill="black"/>
      <!-- Q tail -->
      <polygon points="225,226 270,226 350,320 320,345 235,250" fill="white"/>
      <!-- diagonal gap through tail -->
      <polygon points="226,230 237,230 332,330 321,340" fill="black"/>
    </mask>
  </defs>

  <!-- Transparent background: intentionally no background rectangle -->

  <!-- Stylized GIS / parcel Q -->
  <g mask="url(#qMask)">
    <rect x="35" y="20" width="340" height="350" fill="url(#qGreen)"/>
  </g>

  <!-- Orange accent tile -->
  <polygon points="224,224 273,224 311,264 260,264" fill="#F58A0A"/>
  <polygon points="224,224 260,264 260,292 224,255" fill="#FF9B18"/>

  <!-- Wordmark -->
  <text x="390" y="283"
        font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif"
        font-size="250"
        font-weight="800"
        letter-spacing="-12"
        fill="url(#textGreen)">BDOT</text>
  <text x="1010" y="283"
        font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif"
        font-size="250"
        font-weight="800"
        letter-spacing="-12"
        fill="#273038">10K</text>
</svg>
